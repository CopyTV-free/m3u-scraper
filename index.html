<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U Link Scraper Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>M3U & Video Link Scraper</h1>
        <p class="subtitle">เครื่องมือดึงลิงก์วิดีโอสตรีมมิ่ง (.m3u8/.mp4)</p>
        
        <div class="input-group">
            <label for="targetUrl">ใส่ URL ของหน้าเว็บที่ต้องการดึงลิงก์:</label>
            <input type="url" id="targetUrl" placeholder="https://example.com/watch-anime..." required>
            <button id="scrapeBtn">เริ่มดึงข้อมูล (Scrape)</button>
        </div>

        <div class="status" id="statusText">พร้อมใช้งาน</div>

        <div class="result-box" id="resultContainer" style="display: none;">
            <h3>ผลลัพธ์ลิงก์วิดีโอที่พบ:</h3>
            <textarea id="outputUrls" readonly rows="8"></textarea>
            <button id="copyBtn">คัดลอกทั้้งหมด</button>
            <button id="downloadM3uBtn">ดาวน์โหลดเป็นไฟล์ .m3u</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
